      <script>
            var base = document.createElement('base');
            var path = window.location.pathname;
            var segments = path.split('/');
            if (segments[1] === 'solacera' || segments[1] === 'solace') {
                    base.href = '/' + segments[1] + '/';

                    base.href = '/';
            }
            document.head.appendChild(base);
